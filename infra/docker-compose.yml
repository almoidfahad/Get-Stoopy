name: get-stoopy-dev
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: getstoopy
      POSTGRES_USER: getstoopy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set local password in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data", "./db-init:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getstoopy -d getstoopy"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?local admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?local password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/getstoopy
      KC_DB_USERNAME: getstoopy
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    depends_on:
      db:
        condition: service_healthy
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?local}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  dbdata:
  redisdata:
  miniodata:
