<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
<title id="title">Get Stoopy proposed Phase-1 system architecture</title>
<desc id="desc">Design only. Role clients connect through a same-origin Next.js BFF to one NestJS modular monolith, shared PostgreSQL PostGIS database, Redis and workers. Keycloak and external providers are proposed, not provisioned.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#68717d"/></marker><style>text{font-family:Arial,sans-serif;fill:#17191d}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#59616c}.label{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#59616c}.box{fill:#fff;stroke:#d8dde3;stroke-width:1.5;rx:12}.band{fill:#f7f8fa;stroke:#e2e5e9;rx:14}.edge{fill:none;stroke:#68717d;stroke-width:1.7;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style></defs>
<rect width="1500" height="1120" fill="#fff"/>
<rect x="30" y="22" width="8" height="54" rx="4" fill="#b30d1b"/>
<text x="54" y="48" class="title">Get Stoopy — proposed system architecture</text>
<text x="54" y="73" class="sub">Phase-1 review draft · no service provisioned · one marketplace business database · Shop Smart. Live Better.</text>
<rect x="35" y="98" width="1090" height="125" fill="#f7f8fa" stroke="#e2e5e9" stroke-width="1" rx="14"/><text x="55" y="124" class="label">Role experiences — shared approved design system</text>
<rect x="55" y="140" width="245" height="62" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="177" y="165" text-anchor="middle" class="label">Customer web / account</text><text x="177" y="187" text-anchor="middle" class="small">Next.js · React · TypeScript</text>
<rect x="320" y="140" width="245" height="62" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="442" y="165" text-anchor="middle" class="label">Vendor portal</text><text x="442" y="187" text-anchor="middle" class="small">Store-scoped membership</text>
<rect x="585" y="140" width="245" height="62" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="707" y="165" text-anchor="middle" class="label">Rider PWA</text><text x="707" y="187" text-anchor="middle" class="small">Consented active-shift location</text>
<rect x="850" y="140" width="255" height="62" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="977" y="165" text-anchor="middle" class="label">Scoped admin portals</text><text x="977" y="187" text-anchor="middle" class="small" style="font-size:10px">Local / Zone / City / Region / Country / Super</text>
<rect x="580" y="223" width="1.7" height="31" fill="#68717d"/><polygon points="580,254 584,245 576,245" fill="#68717d"/>
<rect x="35" y="260" width="1090" height="100" fill="#f7f8fa" stroke="#e2e5e9" stroke-width="1" rx="14"/><text x="55" y="286" class="label">Same-origin web boundary</text>
<rect x="55" y="298" width="310" height="46" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="210" y="327" text-anchor="middle" class="body">HTTPS · WAF / CDN · public assets only</text>
<rect x="365" y="321" width="55" height="1.7" fill="#68717d"/><polygon points="420,321 411,317 411,325" fill="#68717d"/>
<rect x="425" y="294" width="680" height="54" fill="#fcebed" stroke="#e7b9be" rx="12"/><text x="765" y="316" text-anchor="middle" class="label">Next.js web + BFF</text><text x="765" y="337" text-anchor="middle" class="small">Opaque Secure HttpOnly session · CSRF + Origin checks · no provider secrets in browser</text>
<rect x="1160" y="98" width="305" height="262" fill="#f7f8fa" stroke="#e2e5e9" stroke-width="1" rx="14"/><text x="1180" y="124" class="label">Identity — proposed</text>
<rect x="1180" y="142" width="265" height="88" fill="#f3eef6" stroke="#d8cde0" rx="12"/><text x="1312" y="168" text-anchor="middle" class="label">Keycloak</text><text x="1312" y="190" text-anchor="middle" class="small">Argon2id policy · TOTP · OIDC</text><text x="1312" y="210" text-anchor="middle" class="small">Safe linking · own schema/migrations</text>
<rect x="1180" y="250" width="265" height="86" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="1312" y="277" text-anchor="middle" class="body">Google · Facebook · LinkedIn · X</text><text x="1312" y="299" text-anchor="middle" class="small">Apple optional / unapproved</text><text x="1312" y="319" text-anchor="middle" class="small">No email-only automatic merge</text>
<rect x="1105" y="321" width="35" height="1.7" fill="#68717d"/><rect x="1140" y="186" width="1.7" height="135" fill="#68717d"/><rect x="1140" y="186" width="40" height="1.7" fill="#68717d"/><polygon points="1180,186 1171,182 1171,190" fill="#68717d"/><text x="1144" y="245" class="small" transform="rotate(-90 1144 245)">Code + PKCE</text>
<rect x="1312" y="230" width="1.7" height="20" fill="#68717d"/><polygon points="1312,230 1308,239 1316,239" fill="#68717d"/>
<rect x="765" y="360" width="1.7" height="38" fill="#68717d"/><polygon points="765,398 769,389 761,389" fill="#68717d"/>
<rect x="35" y="405" width="1430" height="170" fill="#fff" stroke="#b30d1b" stroke-width="1.5" rx="14"/><text x="55" y="432" class="label">One NestJS modular monolith — API-first</text>
<rect x="55" y="450" width="330" height="100" fill="#b30d1b" rx="12"/><text x="220" y="477" text-anchor="middle" class="label" style="fill:#fff">Authorization on every command</text><text x="220" y="501" text-anchor="middle" class="body" style="fill:#fff">Assurance → RBAC → ownership / ABAC</text><text x="220" y="524" text-anchor="middle" class="small" style="fill:#ffe8eb">Field projection · step-up · maker–checker</text>
<rect x="385" y="500" width="40" height="1.7" fill="#68717d"/><polygon points="425,500 416,496 416,504" fill="#68717d"/>
<rect x="430" y="450" width="640" height="100" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="750" y="478" text-anchor="middle" class="label">Guarded domain modules</text><text x="750" y="502" text-anchor="middle" class="body">Catalog · Checkout · Vendor · Delivery · KYC · Finance</text><text x="750" y="525" text-anchor="middle" class="body">Trust · Personalization / AI · Marketing · Platform</text>
<rect x="1100" y="450" width="345" height="100" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="1272" y="478" text-anchor="middle" class="label">Socket.IO gateway</text><text x="1272" y="502" text-anchor="middle" class="small">Authenticated expiring rooms · Redis fan-out</text><text x="1272" y="525" text-anchor="middle" class="small">Events are hints; database state is authoritative</text>
<rect x="1070" y="500" width="30" height="1.7" fill="#68717d"/><polygon points="1100,500 1091,496 1091,504" fill="#68717d"/>
<rect x="1312" y="336" width="1.7" height="44" fill="#68717d"/><rect x="1312" y="380" width="108" height="1.7" fill="#68717d"/><rect x="1420" y="380" width="1.7" height="25" fill="#68717d"/><polygon points="1420,405 1424,396 1416,396" fill="#68717d"/><text x="1330" y="375" class="small">issuer / subject + assurance</text>
<rect x="220" y="575" width="1.7" height="40" fill="#68717d"/><polygon points="220,615 224,606 216,606" fill="#68717d"/><rect x="750" y="575" width="1.7" height="40" fill="#68717d"/><polygon points="750,615 754,606 746,606" fill="#68717d"/><rect x="1272" y="575" width="1.7" height="40" fill="#68717d"/><polygon points="1272,615 1276,606 1268,606" fill="#68717d"/>
<rect x="35" y="620" width="455" height="145" fill="#eef3f7" stroke="#cbd7e0" rx="14"/><text x="262" y="649" text-anchor="middle" class="label">PostgreSQL + PostGIS</text><text x="262" y="674" text-anchor="middle" class="body">Scoped repositories + RLS defense in depth</text><text x="262" y="697" text-anchor="middle" class="body">Immutable balanced journals · constraints</text><text x="262" y="720" text-anchor="middle" class="body">Transactional outbox · one business source of truth</text><text x="262" y="744" text-anchor="middle" class="small">Identity schema remains provider-owned, not per-role databases</text>
<rect x="520" y="620" width="455" height="145" fill="#f6f1e9" stroke="#ded2bf" rx="14"/><text x="747" y="649" text-anchor="middle" class="label">Redis + BullMQ</text><text x="747" y="674" text-anchor="middle" class="body">Scoped cache · rate limits · location freshness</text><text x="747" y="697" text-anchor="middle" class="body">Retries · schedules · Socket.IO adapter</text><text x="747" y="720" text-anchor="middle" class="small">Redis is not the authority for money or assignment</text>
<rect x="1005" y="620" width="460" height="145" fill="#f3eef6" stroke="#d8cde0" rx="14"/><text x="1235" y="649" text-anchor="middle" class="label">Private encrypted object storage</text><text x="1235" y="674" text-anchor="middle" class="body">KYC quarantine · evidence · approved exports</text><text x="1235" y="697" text-anchor="middle" class="body">KMS envelope encryption · malware scanning</text><text x="1235" y="720" text-anchor="middle" class="small">Short-lived authorized access · never public KYC</text>
<rect x="262" y="765" width="1.7" height="40" fill="#68717d"/><polygon points="262,805 266,796 258,796" fill="#68717d"/><text x="275" y="790" class="small">outbox</text>
<rect x="35" y="810" width="940" height="100" fill="#f7f8fa" stroke="#e2e5e9" stroke-width="1" rx="14"/><text x="55" y="838" class="label">Worker process — same guarded domain code</text><text x="55" y="864" text-anchor="middle" class="body"></text><text x="505" y="864" text-anchor="middle" class="body">Offer expiry · reconciliation · Sunday payout reservations · notifications · AI jobs</text><text x="505" y="888" text-anchor="middle" class="small">Inbox receipts + unique business keys · unknown provider results reconcile before retry</text>
<rect x="747" y="765" width="1.7" height="45" fill="#68717d"/><polygon points="747,810 751,801 743,801" fill="#68717d"/><rect x="975" y="860" width="40" height="1.7" fill="#68717d"/><rect x="1015" y="765" width="1.7" height="95" fill="#68717d"/><polygon points="1015,765 1011,774 1019,774" fill="#68717d"/><text x="988" y="805" class="small">guarded writes</text>
<rect x="505" y="910" width="1.7" height="36" fill="#68717d"/><polygon points="505,946 509,937 501,937" fill="#68717d"/>
<rect x="35" y="952" width="1430" height="105" fill="#f7f8fa" stroke="#e2e5e9" stroke-width="1" rx="14"/><text x="55" y="979" class="label">Capability-gated external adapters — none connected</text>
<rect x="55" y="992" width="330" height="48" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="220" y="1012" text-anchor="middle" class="body">Payments / QR / MFS / bank</text><text x="220" y="1031" text-anchor="middle" class="small">Verify · dedupe · reconcile · legal gate</text>
<rect x="405" y="992" width="330" height="48" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="570" y="1012" text-anchor="middle" class="body">Road Routes / Matrix</text><text x="570" y="1031" text-anchor="middle" class="small">Distance evidence + ETA · no fake fallback</text>
<rect x="755" y="992" width="330" height="48" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="920" y="1012" text-anchor="middle" class="body">Email · SMS · push · WhatsApp</text><text x="920" y="1031" text-anchor="middle" class="small">Outbound only · consent / preferences</text>
<rect x="1105" y="992" width="340" height="48" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5" rx="12"/><text x="1275" y="1012" text-anchor="middle" class="body">AI provider</text><text x="1275" y="1031" text-anchor="middle" class="small">Scoped read tools · human approval · no money tools</text>
<rect x="1005" y="810" width="460" height="100" fill="#15171a" rx="14"/><text x="1235" y="839" text-anchor="middle" class="label" style="fill:#fff">Observability + recovery</text><text x="1235" y="864" text-anchor="middle" class="body" style="fill:#fff">Redacted logs · metrics · traces · tamper-evident audit</text><text x="1235" y="888" text-anchor="middle" class="small" style="fill:#d8dde3">Encrypted backups · PITR · restore drills · no OTP / raw KYC</text>
<rect x="1235" y="765" width="1.7" height="45" fill="#68717d" opacity="0.65"/><polygon points="1235,810 1239,801 1231,801" fill="#68717d"/>
<text x="35" y="1094" class="small">Approval of this design permits development only. Paid resources, real payment collection and production deployment require separate explicit authorization.</text>
</svg>
