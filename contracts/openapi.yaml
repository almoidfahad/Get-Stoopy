openapi: 3.1.0
info:
  title: Get Stoopy — proposed marketplace API
  version: 0.1.0-review
  description: PHASE 1 DESIGN ONLY. No endpoint is implemented or connected. Contract validation is not an application/security
    test. All authorization, idempotency and provider requirements are mandatory implementation gates. No live server is declared.
servers:
- url: /api/v1
  description: Proposed same-origin relative base path; not a running service
security:
- sessionCookie: []
tags:
- name: AI
- name: Admin Access
- name: Admin Delivery
- name: Admin Finance
- name: Admin Geography
- name: Admin KYC
- name: Admin Platform
- name: Admin Reports
- name: Admin Security
- name: Admin Trust
- name: Cart
- name: Catalog
- name: Checkout
- name: Finance
- name: Geography
- name: Identity
- name: KYC
- name: Orders
- name: Platform
- name: Privacy
- name: Rider
- name: Safety
- name: Support
- name: Vendor
- name: Wishlist
paths:
  /capabilities:
    get:
      tags:
      - Platform
      summary: Enabled public capabilities without secrets
      operationId: platform_capabilities_get
      security: []
      x-contract-status: PROPOSED_NOT_IMPLEMENTED
      x-authorization: authenticated ownership or explicit grant
      x-required-permission: platform:get
      responses:
        '200':
          description: Authoritative result; no provider success is inferred from a redirect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInfo'
        default:
          description: Stable error; no sensitive internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: requestId
        in: header
        required: false
        schema: &id001
          type: string
          maxLength: 200
        description: Client correlation ID; server generates one if absent.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema: *id001
  /auth/authorize:
    get:
      tags:
      - Identity
      summary: Start OIDC Authorization Code + PKCE through BFF; provider allowlist only
      operationId: identity_auth_authorize_get
      security: []
      x-contract-status: PROPOSED_NOT_IMPLEMENTED
      x-authorization: authenticated ownership or explicit grant
      x-required-permission: identity:get
      responses:
        '302':
          description: Redirect to allowlisted identity provider; state/nonce/PKCE bound to BFF flow.
          headers:
            Location:
              schema:
                type: string
                format: uri
        default:
          description: Stable error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: requestId
        in: header
        required: false
        schema: *id001
        description: Client correlation ID; server generates one if absent.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema: *id001
      description: Returns 302 to an allowlisted identity provider. Exact provider redirects are not executed by this design
        contract.
  /auth/callback:
    get:
      tags:
      - Identity
      summary: Validate state/nonce/issuer and establish opaque BFF session
      operationId: identity_auth_callback_get
      security: []
      x-contract-status: PROPOSED_NOT_IMPLEMENTED
      x-authorization: authenticated ownership or explicit grant
      x-required-permission: identity:get
      responses:
        '302':
          description: Session cookie set only after successful validation; redirect to safe same-origin destination.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          description: Stable error; no session on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: requestId
        in: header
        required: false
        schema: *id001
        description: Client correlation ID; server generates one if absent.
      - name: limit
        in: query
        schema:
