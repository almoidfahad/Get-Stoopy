          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission/scope/assurance denied
          content:
            application/json:
