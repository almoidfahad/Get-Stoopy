      x-contract-status: PROPOSED_NOT_IMPLEMENTED
      x-authorization: authenticated ownership or explicit grant
      x-required-permission: admin platform:get
      responses:
        '200':
          description: Authoritative result; no provider success is inferred from a redirect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInfo'
        default:
          description: Stable error; no sensitive internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission/scope/assurance denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State/version/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: requestId
        in: header
        required: false
        schema: *id001
        description: Client correlation ID; server generates one if absent.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema: *id001
  /ai/approvals/{id}/decision:
    post:
      tags:
      - AI
      summary: Human exact-payload approval through normal domain authority
      operationId: ai_ai_approvals__id__decision_post
      security:
      - sessionCookie: []
      x-contract-status: PROPOSED_NOT_IMPLEMENTED
      x-authorization: authenticated ownership or explicit grant
      x-required-permission: ai:post
      responses:
        '200':
          description: Authoritative result; no provider success is inferred from a redirect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInfo'
        default:
          description: Stable error; no sensitive internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission/scope/assurance denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State/version/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: requestId
        in: header
        required: false
        schema: *id001
        description: Client correlation ID; server generates one if absent.
      - name: id
        in: path
        required: true
        schema: *id002
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalInput'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-gs_session
      description: Opaque Secure/HttpOnly/SameSite session; CSRF + Origin checks on mutations. No bearer token in browser
        storage.
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - amountMinor
      - currency
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: &id004
          type: string
          maxLength: 2000
        requestId: *id001
        details:
          type: object
          additionalProperties: true
        retryAfterSeconds:
          type: integer
          minimum: 0
      required:
      - code
      - message
      - requestId
    PageInfo:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - items
      - nextCursor
    AddressInput:
      type: object
      additionalProperties: false
      properties:
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        regionId: *id002
        districtId: *id002
        cityId: *id002
        line1: *id001
        line2: *id001
        postalCode:
          type: string
          maxLength: 20
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
      - countryCode
      - line1
    RecipientInput:
      type: object
      additionalProperties: false
      properties:
        name: *id001
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
        address:
          $ref: '#/components/schemas/AddressInput'
        isBuyer:
          type: boolean
      required:
      - name
      - phone
      - address
    QuoteRequest:
      type: object
      additionalProperties: false
      properties:
        cartVersion:
          type: integer
          minimum: 1
        recipient:
          $ref: '#/components/schemas/RecipientInput'
        deliveryMode:
          type: string
          enum:
          - STANDARD
        buyerLocation:
          type: object
          additionalProperties: false
          properties:
            latitude:
              type: number
            longitude:
              type: number
            consentId: *id002
        couponCode: *id001
      required:
      - cartVersion
      - recipient
    QuoteGroup:
      type: object
      additionalProperties: false
      properties:
        vendorId: *id002
        storeId: *id002
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        subtotal:
          $ref: '#/components/schemas/Money'
        deliveryFee:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        etaMinutes:
          type: integer
          minimum: 0
    Quote:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        version:
          type: integer
        quoteHash: *id001
        expiresAt: &id003
          type: string
          format: date-time
        destinationZoneId: *id002
        groups:
          type: array
          items:
            $ref: '#/components/schemas/QuoteGroup'
        total:
          $ref: '#/components/schemas/Money'
        policyVersion: *id001
      required:
      - id
      - quoteHash
      - expiresAt
      - groups
      - total
    OrderCreate:
      type: object
      additionalProperties: false
      properties:
        quoteId: *id002
        quoteHash: *id001
        paymentMethod:
          type: string
          enum:
          - COD
          - GATEWAY
          - BANGLA_QR
        consentReferences:
          type: array
          items: *id002
      required:
      - quoteId
      - quoteHash
      - paymentMethod
    OrderSummary:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        publicReference: *id001
        status: *id001
        destinationZoneId: *id002
        total:
          $ref: '#/components/schemas/Money'
        createdAt: *id003
        version:
          type: integer
      required:
      - id
      - publicReference
      - status
      - total
    OrderDetail:
      type: object
      additionalProperties: false
      properties:
        order:
          $ref: '#/components/schemas/OrderSummary'
        recipient:
          $ref: '#/components/schemas/RecipientInput'
        suborders:
          type: array
          items:
            type: object
            additionalProperties: true
        paymentStatus: *id001
        trackingReference: *id001
    VersionReason:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      required:
      - version
    PreparationInput:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
        preparationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
      required:
      - version
      - preparationMinutes
    CartInput:
      type: object
      additionalProperties: false
      properties:
        variantId: *id002
        storeId: *id002
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        cartVersion:
          type: integer
      required:
      - variantId
      - storeId
      - quantity
      - cartVersion
    ShiftInput:
      type: object
      additionalProperties: false
      properties:
        consentVersion: *id001
        locationConsent:
          type: boolean
        startZoneId: *id002
      required:
      - consentVersion
      - locationConsent
      - startZoneId
    LocationInput:
      type: object
      additionalProperties: false
      properties:
        shiftId: *id002
        deliveryId: *id002
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
        recordedAt: *id003
      required:
      - shiftId
      - latitude
      - longitude
      - accuracyMeters
      - recordedAt
    OfferAccept:
      type: object
      additionalProperties: false
      properties:
        sequenceToken: *id001
        version:
          type: integer
      required:
      - sequenceToken
      - version
    OTPVerify:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
        version:
          type: integer
      required:
      - code
      - version
    CODDepositInput:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        method:
          type: string
          enum:
          - COMPANY_OFFICE
          - BANK
          - MERCHANT_MFS
        externalReference: *id001
        evidenceObjectKey: *id001
        submittedAmount:
          $ref: '#/components/schemas/Money'
      required:
      - amount
      - method
    PayoutRequest:
      type: object
      additionalProperties: false
      properties:
        destinationId: *id002
        mode:
          type: string
          enum:
          - SCHEDULED
          - MANUAL
        periodStart: *id003
        periodEnd: *id003
        requestedAmount:
          $ref: '#/components/schemas/Money'
      required:
      - destinationId
      - mode
      - periodStart
      - periodEnd
    DestinationInput:
      type: object
      additionalProperties: false
      properties:
        ownerType:
          type: string
          enum:
          - RIDER
          - VENDOR
        rail:
          type: string
          enum:
          - MFS
          - BANK
        providerKey: *id001
        accountToken: *id001
        ownershipEvidenceKey: *id001
      required:
      - ownerType
      - rail
      - providerKey
    RateSlab:
      type: object
      additionalProperties: false
      properties:
        lowerMeters:
          type: integer
          minimum: 0
        upperMeters:
          type:
          - integer
          - 'null'
          minimum: 1
        payment:
          $ref: '#/components/schemas/Money'
      required:
      - lowerMeters
      - payment
    RateRuleInput:
      type: object
      additionalProperties: false
      properties:
        countryId: *id002
        cityId: *id002
        serviceZoneId: *id002
        effectiveFrom: *id003
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        minimum:
          $ref: '#/components/schemas/Money'
        maximum:
          $ref: '#/components/schemas/Money'
        routingMethod: *id001
        slabs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RateSlab'
        reason: *id004
      required:
      - countryId
      - effectiveFrom
      - currency
      - slabs
      - reason
    CommissionRuleInput:
      type: object
      additionalProperties: false
      properties:
        countryId: *id002
        cityId: *id002
        serviceZoneId: *id002
        vendorId: *id002
        categoryId: *id002
        kind:
          type: string
          enum:
          - PERCENTAGE
          - FIXED
        percentageBps:
          type: integer
          minimum: 0
          maximum: 10000
        fixedAmount:
          $ref: '#/components/schemas/Money'
        basis:
          type: string
          enum:
          - DISCOUNTED_PRODUCT_SUBTOTAL
        effectiveFrom: *id003
        reason: *id004
      required:
      - countryId
      - kind
      - basis
      - effectiveFrom
      - reason
    KYCSubmit:
      type: object
      additionalProperties: false
      properties:
        subjectType:
          type: string
          enum:
          - VENDOR
          - RIDER
          - ADMIN
        policyVersion: *id001
        consentId: *id002
        documentKeys:
          type: array
          minItems: 1
          items: *id001
        profile:
          type: object
          additionalProperties: true
      required:
      - subjectType
      - policyVersion
      - consentId
      - documentKeys
    ReviewDecisionInput:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          - MORE_INFORMATION
        reason: *id004
        documentDecisions:
          type: array
          items:
            type: object
            additionalProperties: true
        verificationMethod:
          type: string
          enum:
          - MANUAL_DOCUMENT_REVIEW
          - AUTHORIZED_PROVIDER
          - AUTHORIZED_OFFICIAL_CHANNEL
          - IN_PERSON
      required:
      - decision
      - reason
      - verificationMethod
    ScopeGrant:
      type: object
      additionalProperties: false
      properties:
        userId: *id002
        geographyType:
          type: string
          enum:
          - COUNTRY
          - REGION
          - DISTRICT
          - CITY
          - ZONE
          - NEIGHBORHOOD
        geographyId: *id002
        roleIds:
          type: array
          items: *id002
        effectiveFrom: *id003
        expiresAt: *id003
        reason: *id004
      required:
      - userId
      - geographyType
      - geographyId
      - roleIds
      - reason
    RefundInput:
      type: object
      additionalProperties: false
      properties:
        orderId: *id002
        suborderId: *id002
        amount:
          $ref: '#/components/schemas/Money'
        reason: *id004
        evidenceKeys:
          type: array
          items: *id001
      required:
      - orderId
      - amount
      - reason
    ApprovalInput:
      type: object
      additionalProperties: false
      properties:
        actionHash: *id001
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        reason: *id004
        stepUpToken: *id001
      required:
      - actionHash
      - decision
      - reason
      - stepUpToken
    AIRequest:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum:
          - SHOPPING_SEARCH
          - PRODUCT_DRAFT
          - OWN_STATUS
          - SCOPED_REPORT
        query:
          type: string
          minLength: 1
          maxLength: 4000
        consentId: *id002
        scopeSelectionId: *id002
      required:
      - purpose
      - query
    ConsentInput:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum:
          - PERSONALIZATION
          - MARKETING
          - LOCATION
          - VOICE_SEARCH
          - CROSS_DEVICE_SYNC
        granted:
          type: boolean
        policyVersion: *id001
      required:
      - purpose
      - granted
      - policyVersion
    GeographyInput:
      type: object
      additionalProperties: false
      properties:
        parentId: *id002
        kind:
          type: string
          enum:
          - COUNTRY
          - REGION
          - DISTRICT
          - CITY
          - ZONE
          - NEIGHBORHOOD
        code: *id001
        nameTranslations:
          type: object
          additionalProperties: *id001
        timezone: *id001
        reason: *id004
      required:
      - kind
      - code
      - nameTranslations
      - reason
    PolygonProposal:
      type: object
      additionalProperties: false
      properties:
        ownerType:
          type: string
          enum:
          - CITY
          - ZONE
          - NEIGHBORHOOD
        ownerId: *id002
        geojson:
          type: object
          additionalProperties: true
        validFrom: *id003
        source: *id001
        reason: *id004
      required:
      - ownerType
      - ownerId
      - geojson
      - validFrom
      - reason
    ProductInput:
      type: object
      additionalProperties: false
      properties:
        categoryId: *id002
        title: *id001
        description: *id004
        attributes:
          type: object
          additionalProperties: true
        variants:
          type: array
          items:
            type: object
            additionalProperties: true
        version:
          type: integer
      required:
      - categoryId
      - title
    StockInput:
      type: object
      additionalProperties: false
      properties:
        storeId: *id002
        variantId: *id002
        onHand:
          type: integer
          minimum: 0
        reorderLevel:
          type: integer
          minimum: 0
        version:
          type: integer
        reason: *id004
      required:
      - storeId
      - variantId
      - onHand
      - version
      - reason
    SupportInput:
      type: object
      additionalProperties: false
      properties:
        subject: *id001
        category: *id001
        message: *id004
        resourceType: *id001
        resourceId: *id002
      required:
      - subject
      - category
      - message
